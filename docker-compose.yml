name: attendance-phase1-fresh
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=1GB]
    ports: ["127.0.0.1:19090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring, observability_ui]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.4
    ports: ["127.0.0.1:13001:3000"]
    env_file: [.env.grafana]
    environment:
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SERVER_ROOT_URL: http://127.0.0.1:13001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring, observability_ui]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    command:
      - --docker_only=true
      - --containerd=/rootfs/run/containerd/containerd.sock
      - --housekeeping_interval=10s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,resctrl,process,disk
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    command: [--nginx.scrape-uri=http://nginx:9091/stub_status]
    networks:
      monitoring:
      proxy:
        ipv4_address: 172.30.87.4
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    command:
      - --config.my-cnf=/run/secrets/mysql-exporter.cnf
      - --collect.global_status
      - --collect.global_variables
      - --no-collect.slave_status
      - --no-collect.info_schema.innodb_cmp
      - --no-collect.info_schema.innodb_cmpmem
      - --no-collect.info_schema.query_response_time
    volumes:
      - ./secrets/mysql-exporter.cnf:/run/secrets/mysql-exporter.cnf:ro
    networks: [monitoring, database]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    user: nginx
    entrypoint: [nginx, -g, 'daemon off;']
    ports:
      - "127.0.0.1:18087:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/monitoring.conf:/etc/nginx/conf.d/monitoring.conf:ro
      - ./nginx/errors:/usr/share/nginx/errors:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      web:
        condition: service_healthy
    networks:
      frontend:
      proxy:
        ipv4_address: 172.30.87.2
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  web:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: attendance_phase1
      DB_USER: attendance_app
      DB_PASSWORD: ${DB_PASSWORD:?Create .env first}
    depends_on:
      db:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: 172.30.87.3
      database:
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8080/health.php') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: attendance_phase1
      MYSQL_USER: attendance_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Create .env first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Create .env first}
    volumes:
      - phase1_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/permissions.sql:/docker-entrypoint-initdb.d/002-permissions.sql:ro
      - ./database/consistency.sql:/docker-entrypoint-initdb.d/003-consistency.sql:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "127.0.0.1:${PMA_PORT:-18086}:80"
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 0
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, database]
    restart: unless-stopped
networks:
  monitoring:
    internal: true
  observability_ui:
  frontend:
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.30.87.0/29
  database:
    internal: true
volumes:
  prometheus_data:
  grafana_data:
  phase1_data:
