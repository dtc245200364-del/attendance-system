# Trust only the fixed Nginx address on the dedicated proxy network.
ServerName attendance.local
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 172.30.87.2
SetEnvIfExpr "%{CONN_REMOTE_ADDR} == '172.30.87.2' && req('X-Forwarded-Proto') == 'https'" HTTPS=on
<Location "/">
    Require expr "%{CONN_REMOTE_ADDR} == '172.30.87.2' || %{CONN_REMOTE_ADDR} == '127.0.0.1' || %{CONN_REMOTE_ADDR} == '::1'"
</Location>
LogFormat "peer=%{c}a client=%a host=%{Host}i proto=%{X-Forwarded-Proto}i method=%m path=%U status=%>s" trusted_proxy
CustomLog /proc/self/fd/1 trusted_proxy
