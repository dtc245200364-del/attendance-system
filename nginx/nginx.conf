worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Never log IP, query string, cookies, headers or arbitrary URL paths.
    map $uri $log_route {
        default other;
        / index;
        /index.php index;
        /classes.php classes;
        /students.php students;
        /attendance.php attendance;
        /history.php history;
        /statistics.php statistics;
        /health.php health;
        /healthz health;
        /phase4-log-proof proof;
    }
    map $status $log_level {
        ~^5 error;
        ~^4 warn;
        default info;
    }
    map $request_method $log_method {
        default OTHER;
        GET GET;
        POST POST;
        HEAD HEAD;
        OPTIONS OPTIONS;
    }
    log_format attendance_safe escape=json '{"source":"nginx","method":"$log_method","route":"$log_route","status":$status,"level":"$log_level","request_id":"$request_id"}';
    access_log /dev/stdout attendance_safe;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    include /etc/nginx/conf.d/*.conf;
}
