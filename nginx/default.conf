server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Powered-By;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # This is the public edge: discard any chain supplied by the caller.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 18087;
    proxy_set_header Forwarded "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    proxy_intercept_errors on;
    proxy_redirect off;

    # Runtime DNS lookup follows web container address changes after a rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $attendance_backend web:8080;
    location = /healthz { proxy_pass http://$attendance_backend/health.php; }
    location / { proxy_pass http://$attendance_backend$request_uri; }
    location ~ /\. { deny all; }

    error_page 502 503 504 /_errors/upstream.html;
    error_page 413 /_errors/too-large.html;
    location /_errors/ {
        internal;
        alias /usr/share/nginx/errors/;
    }
}
